<div
  class="mt-3 rounded-xl border border-red-200 bg-red-50 p-4"
>
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">

    <div>
      <h3 class="text-sm font-semibold text-red-900">
        Delete issue?
      </h3>

      <p class="mt-1 text-sm text-red-700">
        Are you sure you want to delete
        <span class="font-semibold">"{{ issue().title }}"</span>?
      </p>

      <p class="mt-1 text-xs text-red-600">
        This action cannot be undone.
      </p>
    </div>

    <div class="flex shrink-0 gap-2">
      <button
        type="button"
        (click)="cancelledClicked.emit()"
        class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
      >
        Cancel
      </button>

      <button
        type="button"
        (click)="confirmedClicked.emit()"
        class="rounded-lg bg-red-600 px-3 py-1.5 text-sm font-medium text-white transition hover:bg-red-700"
      >
        Delete
      </button>
    </div>

  </div>
</div>
