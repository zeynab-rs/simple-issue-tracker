<article
  class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-slate-300 hover:shadow-md">
  <!-- Header -->
  <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between">
    <div class="min-w-0">
      <h2 class="truncate text-lg font-semibold text-slate-900">
        {{ issue().title }}
      </h2>
    </div>

    <!-- Priority -->
    @if (issue().priority === 'HIGH') {
    <span class="inline-flex w-fit rounded-full bg-red-100 px-2.5 py-1 text-xs font-semibold text-red-700">
      High
    </span>
    } @else if (issue().priority === 'MEDIUM') {
    <span class="inline-flex w-fit rounded-full bg-amber-100 px-2.5 py-1 text-xs font-semibold text-amber-700">
      Medium
    </span>
    } @else {
    <span class="inline-flex w-fit rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-semibold text-emerald-700">
      Low
    </span>
    }
  </div>

  <!-- Description -->
  <p class="mt-4 text-sm leading-6 text-slate-600">
    {{ issue().description }}
  </p>

  <!-- Footer -->
  <div class="mt-5 flex flex-col gap-4 border-t border-slate-100 pt-4 sm:flex-row sm:items-center sm:justify-between">
    <!-- Status -->
    @if (issue().status === 'TODO') {
    <span class="inline-flex w-fit rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700">
      To Do
    </span>
    } @else if (issue().status === 'IN_PROGRESS') {
    <span class="inline-flex w-fit rounded-full bg-blue-100 px-2.5 py-1 text-xs font-medium text-blue-700">
      In Progress
    </span>
    } @else {
    <span class="inline-flex w-fit rounded-full bg-emerald-100 px-2.5 py-1 text-xs font-medium text-emerald-700">
      Done
    </span>
    }

    <!-- Actions -->
    <div class="flex items-center gap-2">
      <a [routerLink]="['/issues', issue().id]"
        class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
        Edit
      </a>

      <button type="button" (click)="onDelete()"
        class="rounded-lg border border-red-200 px-3 py-1.5 text-sm font-medium text-red-600 transition hover:bg-red-50">
        Delete
      </button>
    </div>
  </div>
</article>
